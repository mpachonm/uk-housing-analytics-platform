version: 2

sources:
  - name: bronze
    description: "Raw ingested GOV.UK datasets landed as compressed Parquet and registered in DuckDB."
    schema: bronze
    tables:
      - name: raw_price_paid
        description: "HM Land Registry Price Paid Data (2024-2026) property transactions in England and Wales."
        columns:
          - name: transaction_id
            description: "Unique GUID generated by HM Land Registry for each property sale."
            tests:
              - not_null
          - name: price
            description: "Sale price stated on the transfer deed in GBP."
            tests:
              - not_null

      - name: raw_onspd
        description: "Office for National Statistics Postcode Directory (ONSPD) master lookup."
        columns:
          - name: pcds
            description: "Standardized 1-space postcode format (e.g., SW1A 1AA)."
            tests:
              - not_null
              - unique